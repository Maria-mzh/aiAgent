<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f0f4ff 50%, #e8f0fe 100%);
    }
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="flex min-h-screen flex-wrap items-center justify-center gap-10 p-10">
  <!-- 复制整个 phone-screen 区块以创建多页面流程。 -->
  <div id="phone-screen-1" class="relative box-border flex h-[812px] w-[375px] flex-col overflow-hidden rounded-[40px] border-[8px] border-black bg-white shadow-2xl">
    <div class="absolute left-0 top-0 z-50 flex h-12 w-full items-end justify-between px-6 pb-2">
      <span class="text-sm font-semibold text-black">9:41</span>
      <div class="flex items-center gap-1.5 text-black">
        <i class="ri-signal-wifi-fill text-sm" aria-hidden="true"></i>
        <i class="ri-battery-charge-fill text-sm" aria-hidden="true"></i>
      </div>
    </div>

    <main class="h-full overflow-y-auto px-5 pb-24 pt-14 text-black">
      <!-- 根据需求添加页面内容。 -->
    </main>

    <nav class="glass absolute bottom-0 z-50 flex h-[66px] w-full items-start justify-around pt-1 text-black" aria-label="主导航">
      <button class="flex cursor-pointer flex-col items-center opacity-40 transition hover:opacity-70" type="button">
        <i class="ri-home-5-fill text-2xl" aria-hidden="true"></i>
        <span class="text-[10px] font-medium">首页</span>
      </button>
      <button class="flex cursor-pointer flex-col items-center text-black transition active:scale-95" type="button" aria-current="page">
        <i class="ri-robot-line text-2xl" aria-hidden="true"></i>
        <span class="text-[10px] font-semibold">功能</span>
      </button>
      <button class="flex cursor-pointer flex-col items-center opacity-40 transition hover:opacity-70" type="button">
        <i class="ri-user-3-line text-2xl" aria-hidden="true"></i>
        <span class="text-[10px] font-medium">我的</span>
      </button>
    </nav>
    <div class="absolute bottom-1 left-1/2 z-50 h-1 w-32 -translate-x-1/2 rounded-full bg-black opacity-20"></div>
  </div>
</body>
</html>
